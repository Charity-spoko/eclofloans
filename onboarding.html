<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ECLOF Onboarding</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom right, #ffffff, #dfffe0);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background-color: #fff;
      border-radius: 12px;
      padding: 2rem 2.5rem;
      box-shadow: 0 4px 20px rgba(0, 128, 0, 0.2);
      width: 100%;
      max-width: 400px;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-container h3 {
      color: green;
      margin-bottom: 1.5rem;
    }

    .form-control:focus {
      border-color: green;
      box-shadow: 0 0 0 0.2rem rgba(0, 128, 0, 0.25);
    }

    .logo {
      width: 60px;
      height: 60px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: gray;
    }
  </style>
</head>
<body>

<div class="login-container text-center">
  <img src="eclof.png" class="logo mb-3" alt="ECLOF Logo">
  <h3>ECLOF Loan Management System</h3>
  <form id="loginForm">
    <div class="form-group mb-3 text-start">
      <label>Username</label>
      <input type="text" class="form-control" id="username" required>
    </div>
    <div class="form-group mb-3 text-start position-relative">
      <label>Password</label>
      <input type="password" class="form-control" id="password" required>
      <span class="toggle-password" onclick="togglePassword()">👁️</span>
    </div>
    <div class="form-group mb-4 text-start">
      <label>Role</label>
      <select class="form-select" id="role" required>
        <option value="">Select Role</option>
        <option value="admin">Admin</option>
        <option value="loan_officer">Loan Officer</option>
        <option value="branch_manager">Branch Manager</option>
      </select>
    </div>
    <button type="submit" class="btn btn-success w-100">Login</button>
  </form>
  <div id="errorMsg" class="text-danger mt-2" style="display: none;">Invalid credentials. Try again.</div>
</div>

<!-- Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "SENDER_ID",
    appId: "APP_ID"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const role = document.getElementById("role").value;

    const snapshot = await db.collection("users")
      .where("username", "==", username)
      .where("password", "==", password)
      .where("role", "==", role)
      .get();

    if (!snapshot.empty) {
      if (role === "admin") window.location.href = "admin.html";
      else if (role === "loan_officer") window.location.href = "loanofficer.html";
      else if (role === "branch_manager") window.location.href = "branchmanager.html";
    } else {
      document.getElementById("errorMsg").style.display = "block";
    }
  });

  function togglePassword() {
    const passInput = document.getElementById("password");
    passInput.type = passInput.type === "password" ? "text" : "password";
  }
</script>

</body>
</html>
