<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Branch Manager Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
    }
    .sidebar {
      height: 100vh;
      background-color: #343a40;
      color: white;
      padding-top: 1rem;
      position: fixed;
      width: 250px;
    }
    .sidebar a {
      color: white;
      display: block;
      padding: 0.75rem 1rem;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #495057;
    }
    .header {
      background-color: green;
      color: white;
      padding: 1rem;
      position: fixed;
      left: 250px;
      right: 0;
      top: 0;
      z-index: 1000;
    }
    .content {
      margin-left: 250px;
      padding: 2rem 1rem 1rem 1rem;
      padding-top: 6rem;
    }
    .card {
      margin-bottom: 1rem;
    }
    .icon {
      font-size: 2rem;
      margin-right: 10px;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h4 class="text-center">Branch Manager</h4>
    <a href="#">Dashboard</a>
    <a href="reports.html">Reports</a>
    <a href="#logout" id="logoutlink">Logout</a>
  </div>

  <div class="header">
    <h3 class="mb-0">ECLOF Branch Manager Dashboard</h3>
  </div>

  <div class="content">
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-6 col-xl-4">
          <div class="card">
            <div class="card-body d-flex align-items-center">
              <i class="bi bi-person-lines-fill icon text-primary"></i>
              <div>
                <h5>Loan Applicants</h5>
                <p class="mb-0">Total: 45 Applicants</p>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6 col-xl-4">
          <div class="card">
            <div class="card-body d-flex align-items-center">
              <i class="bi bi-people-fill icon text-success"></i>
              <div>
                <h5>Borrowers</h5>
                <p class="mb-0">Total: 32 Borrowers</p>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6 col-xl-4">
          <div class="card">
            <div class="card-body d-flex align-items-center">
              <i class="bi bi-cash-coin icon text-warning"></i>
              <div>
                <h5>Disbursements</h5>
                <p class="mb-0">Total: MWK 5,000,000 | People :40</p>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6 col-xl-6">
          <div class="card">
            <div class="card-body d-flex align-items-center">
              <i class="bi bi-arrow-down-circle icon text-danger"></i>
              <div>
                <h5>Loans Due</h5>
                <p class="mb-0">Amount: MWK 1,200,000 | People: 12</p>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6 col-xl-6">
          <div class="card">
            <div class="card-body d-flex align-items-center">
              <i class="bi bi-arrow-up-circle icon text-info"></i>
              <div>
                <h5>Loans Received</h5>
                <p class="mb-0">Amount: MWK 3,700,000 | People: 27</p>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('logoutlink').addEventListener('click', function(e) {
      e.preventDefault();
      localStorage.removeItem('branchManager');
      alert('Logged out successfully!');
      window.location.href = 'onboarding.html';
    });
  </script>
</body>
</html>
