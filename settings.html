<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
    .header { background-color: green; color: white; padding: 1rem; text-align: center; }
    .container { margin-top: 2rem; }
    .toggle-password { cursor: pointer; margin-left: 5px; }
  </style>
</head>
<body>

  <div class="header">
    <h3>Settings <a href="di.html" class="btn btn-sm btn-outline-light float-end">Go to Home</a></h3>
  </div>

  <div class="container">
    <form>
      <div class="mb-3">
        <label class="form-label">Loan Limit (MWK)</label>
        <input type="number" class="form-control" id="loanLimit" placeholder="Enter loan limit">
      </div>
      <div class="mb-3">
        <label class="form-label">Interest Rate (%)</label>
        <input type="number" step="0.01" class="form-control" id="interestRate" placeholder="Enter interest rate">
      </div>
      <div class="mb-3">
        <label class="form-label">Notification Email</label>
        <input type="email" class="form-control" id="notificationEmail" placeholder="admin@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Currency</label>
        <select class="form-select" id="currency">
          <option value="MWK">MWK</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
        </select>
      </div>

      <!-- User Management -->
      <div class="card mt-4">
        <div class="card-header">User Management</div>
        <div class="card-body">
          <form id="addUserForm" class="row g-3">
            <div class="col-md-4">
              <input type="text" class="form-control mb-2" id="username" placeholder="Username" required>
              <div class="input-group">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePassword">👁️</button>
              </div>
            </div>
            <div class="col-md-4">
              <select class="form-select" id="role" required>
                <option value="">Select Role</option>
                <option value="loan_officer">Loan Officer</option>
                <option value="branch_manager">Branch Manager</option>
              </select>
            </div>
            <div class="col-md-4">
              <button type="submit" class="btn btn-primary">Add User</button>
            </div>
          </form>
        </div>
      </div>

      <button type="button" id="saveBtn" class="btn btn-success mt-3">Save Settings</button>
    </form>
  </div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyC_jj0i3VxG-HjKHABbyMDyyO_PztkcTYs",
    authDomain: "loanmanagement-cc0c3.firebaseapp.com",
    projectId: "loanmanagement-cc0c3",
    storageBucket: "loanmanagement-cc0c3.appspot.com",
    messagingSenderId: "439123722675",
    appId: "1:439123722675:web:8f9796cc48ad57384a0bc6"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Save Settings Dummy Handler
  document.getElementById('saveBtn').addEventListener('click', function () {
    alert('Settings successfully saved!');
    setTimeout(() => {
      window.location.href = 'di.html';
    }, 1500);
  });

  // Toggle Password Visibility
  document.getElementById('togglePassword').addEventListener('click', () => {
    const passwordField = document.getElementById('password');
    passwordField.type = passwordField.type === 'password' ? 'text' : 'password';
  });

  // Add User Handler
  document.getElementById('addUserForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const role = document.getElementById('role').value;

    if (!username || !password || !role) return alert("Please fill all fields.");

    const permissions = role === "loan_officer"
      ? "Loan Approval, Remove Borrower, and any loan-related actions"
      : "View Only";

    db.collection("users").add({
      username,
      password,
      role,
      permissions,
      createdAt: new Date()
    }).then(() => {
      alert("User added successfully to Firebase!");
      document.getElementById('addUserForm').reset();
    }).catch((error) => {
      console.error("Error adding user: ", error);
      alert("Failed to add user.");
    });
  });
</script>
</body>
</html>
