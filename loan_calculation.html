<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Loan Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function getQueryParams() {
      const params = {};
      location.search.substring(1).split("&").forEach(pair => {
        const [key, value] = pair.split("=");
        params[key] = decodeURIComponent(value || "");
      });
      return params;
    }

    window.addEventListener("DOMContentLoaded", () => {
      const params = getQueryParams();
      if (params.borrowerName) {
        document.getElementById("borrowerName").textContent = params.borrowerName;
      }
      if (params.borrowerId) {
        window.borrowerId = params.borrowerId;
      }
    });

    document.getElementById("loanForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const amount = parseFloat(document.getElementById("amount").value);
      const interest = parseFloat(document.getElementById("interest").value);
      const months = parseFloat(document.getElementById("months").value);
      const penaltyRate = parseFloat(document.getElementById("penalty").value);

      const totalPayable = amount + (amount * (interest / 100));
      const monthly = totalPayable / months;
      const penalty = monthly * (penaltyRate / 100);

      document.getElementById("totalPayable").textContent = totalPayable.toFixed(2);
      document.getElementById("monthlyPayable").textContent = monthly.toFixed(2);
      document.getElementById("penaltyAmount").textContent = penalty.toFixed(2);

      document.getElementById("result").style.display = "block";

      if(window.borrowerId) {
        try {
          await addDoc(collection(db, "users", window.borrowerId, "loans"), {
            amount,
            interest,
            months,
            penaltyRate,
            totalPayable,
            monthly,
            penalty,
            createdAt: Timestamp.now()
          });
          alert("Loan calculation saved successfully.");
        } catch (error) {
          console.error("Error saving loan calculation:", error);
          alert("Failed to save loan calculation.");
        }
      }
    });
  </script>
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card">
    <div class="card-header bg-success text-white">
      <h4 class="mb-0">Loan Calculator</h4>
    </div>
    <div class="card-body">
      <h5>Loan Calculation for: <span id="borrowerName">Unknown</span></h5>
      <form id="loanForm" class="mt-3">
        <div class="mb-3">
          <label for="amount" class="form-label">Loan Amount</label>
          <input type="number" class="form-control" id="amount" required />
        </div>
        <div class="mb-3">
          <label for="interest" class="form-label">Interest Rate (%)</label>
          <input type="number" class="form-control" id="interest" required />
        </div>
        <div class="mb-3">
          <label for="months" class="form-label">Repayment Period (Months)</label>
          <input type="number" class="form-control" id="months" required />
        </div>
        <div class="mb-3">
          <label for="penalty" class="form-label">Penalty Rate (%)</label>
          <input type="number" class="form-control" id="penalty" required />
        </div>
        <button type="submit" class="btn btn-primary">Calculate</button>
      </form>

      <div id="result" class="mt-4" style="display:none">
        <hr />
        <table class="table table-bordered">
          <thead class="table-light">
            <tr>
              <th class="text-center">Total Payable Amount</th>
              <th class="text-center">Monthly Payable Amount</th>
              <th class="text-center">Penalty Amount</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="text-center" id="totalPayable"></td>
              <td class="text-center" id="monthlyPayable"></td>
              <td class="text-center" id="penaltyAmount"></td>
            </tr>
          </tbody>
        </table>
        <hr />
      </div>
    </div>
  </div>
</div>

</body>
</html>
