<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Officer Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, collection, getDocs, updateDoc, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyChvykBQXMRa7W9XBLWUVIcqc04d4ix7K0",
      authDomain: "job-application-44096.firebaseapp.com",
      projectId: "job-application-44096",
      storageBucket: "job-application-44096.appspot.com",
      messagingSenderId: "139219604583",
      appId: "1:139219604583:web:d6e04aa9666ef0a41c30c2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function calculateCreditScore(income, repaymentHistory) {
      let score = income >= 250000 ? 'High' : income >= 100000 ? 'Moderate' : 'Low';
      let badge = score === 'High' ? 'success' : score === 'Moderate' ? 'warning' : 'danger';

      if (repaymentHistory && repaymentHistory.length > 0) {
        const defaults = repaymentHistory.filter(t => t.status === 'late').length;
        if (defaults > 1) {
          score = 'Low';
          badge = 'danger';
        }
      }

      return { score, badge };
    }

    let allApplications = [];

    async function loadDashboardData(filter = 'All') {
      const querySnapshot = await getDocs(collection(db, "loan_applications"));
      let total = 0, pending = 0, approved = 0;
      const applicationList = document.getElementById("applicationList");
      applicationList.innerHTML = "";

      allApplications = [];

      for (const docSnap of querySnapshot.docs) {
        const data = docSnap.data();
        data.id = docSnap.id;
        total++;
        if (data.status || data.status === "Pending") pending++;
        if (data.status === "Approved") approved++;

        // Simulate repayment history for demo purposes
        const repaymentHistory = data.repaymentHistory || [];
        const score = calculateCreditScore(data.monthlyIncome, repaymentHistory);

        if (filter !== 'All' && score.score !== filter) continue;

        allApplications.push({ ...data, credit: score });
      }

      // Sort high chance to low
      allApplications.sort((a, b) => {
        const priority = { High: 3, Moderate: 2, Low: 1 };
        return priority[b.credit.score] - priority[a.credit.score];
      });

      allApplications.forEach(data => {
        const card = document.createElement("div");
        card.className = `card mb-3 border-${data.credit.badge}`;
        card.innerHTML = `
          <div class="card-body">
            <h5 class="card-title">${data.fullName} (${data.username})
              <span class="badge bg-${data.credit.badge} ms-2">${data.credit.score} Chance</span>
            </h5>
            <p class="card-text">
              <strong>Loan Type:</strong> ${data.loanType}<br>
              <strong>Income:</strong> MWK ${data.monthlyIncome}<br>
              <strong>Requested:</strong> MWK ${data.requestedLoanAmount}<br>
              <strong>Status:</strong> ${data.status || 'Pending'}
            </p>
            <button class="btn btn-success me-2" onclick="approveLoan('${data.id}')">Approve</button>
            <button class="btn btn-danger" onclick="rejectLoan('${data.id}')">Reject</button>
          </div>
        `;
        applicationList.appendChild(card);
      });

      document.getElementById("totalApplications").innerText = total;
      document.getElementById("pendingApplications").innerText = pending;
      document.getElementById("approvedLoans").innerText = approved;
    }

    window.approveLoan = async function(id) {
      await updateDoc(doc(db, "loan_applications", id), { status: "Approved" });
      loadDashboardData();
    }

    window.rejectLoan = async function(id) {
      await updateDoc(doc(db, "loan_applications", id), { status: "Rejected" });
      loadDashboardData();
    }

    window.onload = () => loadDashboardData();
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
    }
    .sidebar {
      height: 100vh;
      background-color: #343a40;
      color: white;
      padding-top: 1rem;
      position: fixed;
      width: 250px;
    }
    .sidebar a {
      color: white;
      display: block;
      padding: 0.75rem 1rem;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #495057;
    }
    .header {
      background-color: green;
      color: white;
      padding: 1rem;
      position: fixed;
      left: 250px;
      right: 0;
      top: 0;
      z-index: 1000;
    }
    .content {
      margin-left: 250px;
      padding: 2rem 1rem 1rem 1rem;
      padding-top: 6rem;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h4 class="text-center">Loan Officer</h4>
    <a href="#">Dashboard</a>
    <a href="borrowers.html">Borrowers</a>
    <a href="repayment.html">Repayments</a>
    <a href="reports.html">Reports</a>
    <a href="#" id="logoutlink">Logout</a>
  </div>
  <div class="header">
    <h3 class="mb-0">ECLOF Loan Officer Dashboard</h3>
  </div>
  <div class="content">
    <div class="container-fluid">
      <div class="row mb-3">
        <div class="col-md-3">
          <label for="creditFilter" class="form-label">Filter by Credit Score</label>
          <select id="creditFilter" class="form-select" onchange="loadDashboardData(this.value)">
            <option value="All">All</option>
            <option value="High">High</option>
            <option value="Moderate">Moderate</option>
            <option value="Low">Low</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <div class="card text-white bg-success">
            <div class="card-body">
              <h5 class="card-title">Total Applications</h5>
              <p class="card-text display-6" id="totalApplications">0</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card text-white bg-info">
            <div class="card-body">
              <h5 class="card-title">Pending Applications</h5>
              <p class="card-text display-6" id="pendingApplications">0</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Approved Loans</h5>
              <p class="card-text display-6" id="approvedLoans">0</p>
            </div>
          </div>
        </div>
      </div>
      <div class="mt-4" id="applicationList"></div>
    </div>
  </div>
  <script>
    document.getElementById('logoutlink').addEventListener('click', function(e) {
      e.preventDefault();
      localStorage.removeItem('loanUser');
      alert('Logged out successfully!');
      window.location.href = 'onboarding.html';
    });
  </script>
</body>
</html>
