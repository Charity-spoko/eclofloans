<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Users</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
    }
    .header {
      background-color: green;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    .container {
      margin-top: 2rem;
    }
    .password-toggle {
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h3>System Users <a href="di.html" class="btn btn-sm btn-outline-light float-end">Go to Home</a></h3>
  </div>

  <div class="container">
    <table class="table table-striped">
      <thead class="table-success">
        <tr>
          <th>Username</th>
          <th>Password</th>
          <th>Role</th>
          <th>Permissions</th>
        </tr>
      </thead>
    
    </table>
  </div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyC_jj0i3VxG-HjKHABbyMDyyO_PztkcTYs",
    authDomain: "loanmanagement-cc0c3.firebaseapp.com",
    projectId: "loanmanagement-cc0c3",
    storageBucket: "loanmanagement-cc0c3.appspot.com",
    messagingSenderId: "439123722675",
    appId: "1:439123722675:web:8f9796cc48ad57384a0bc6"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  async function loadUsers() {
    const tbody = document.getElementById('userTableBody');
    tbody.innerHTML = '';
    const snapshot = await db.collection('users').orderBy("createdAt", "desc").get();

    if (snapshot.empty) {
      tbody.innerHTML = '<tr><td colspan="4">No users found.</td></tr>';
      return;
    }

    snapshot.forEach(doc => {
      const data = doc.data();
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${data.username}</td>
        <td><input type="password" class="form-control form-control-sm" value="${data.password}" readonly>
            <button class="btn btn-sm btn-outline-secondary mt-1 toggleBtn">👁️</button></td>
        <td>${data.role.replace('_', ' ').toUpperCase()}</td>
        <td>${data.permissions}</td>
      `;
      tbody.appendChild(tr);
    });

    // Toggle visibility
    document.querySelectorAll('.toggleBtn').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.previousElementSibling;
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });
  }

  window.addEventListener('DOMContentLoaded', loadUsers);
</script>
</body>
</html>
