<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loan Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body class="bg-light">

<div class="container-fluid mt-4">
  <div class="row mb-3">
    <div class="col-lg-12">
      <h3 id="welcomeMessage">Welcome back!</h3>
    </div>
  </div>

  <div class="row" id="dashboardCards">
    <!-- Cards will be inserted here -->
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

<script>
  // Firebase config (replace with your actual config)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "SENDER_ID",
    appId: "APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  document.addEventListener("DOMContentLoaded", async () => {
    const welcomeMessage = document.getElementById("welcomeMessage");

    // Simulate user login (replace with real auth if needed)
    const username = localStorage.getItem("username") || "Loan Officer";
    welcomeMessage.textContent = `Welcome back, ${username}!`;

    // Fetch dashboard data
    const today = new Date().toISOString().slice(0, 10);

    let paymentsToday = 0;
    let borrowerCount = 0;
    let activeLoans = 0;
    let totalReceivable = 0;

    try {
      // Payments Today
      const paymentsSnap = await db.collection("transactions")
        .where("transactionDate", "==", today).get();
      paymentsToday = paymentsSnap.docs.reduce((sum, doc) => sum + doc.data().amountPaid, 0);

      // Borrowers
      const borrowersSnap = await db.collection("users").get();
      borrowerCount = borrowersSnap.size;

      // Active Loans
      const loansSnap = await db.collection("loans").where("status", "==", "active").get();
      activeLoans = loansSnap.size;

      // Total Receivable
      const totalLoanAmount = loansSnap.docs.reduce((sum, doc) => {
        const l = doc.data();
        const interest = (l.amount * (l.interestRate / 100));
        return sum + l.amount + interest;
      }, 0);

      const allPaymentsSnap = await db.collection("transactions").get();
      const totalPaid = allPaymentsSnap.docs.reduce((sum, doc) => sum + doc.data().amountPaid, 0);
      totalReceivable = totalLoanAmount - totalPaid;

    } catch (error) {
      console.error("Error loading dashboard:", error);
    }

    // Render cards
    const cardTemplate = (bg, title, value, link, icon) => `
      <div class="col-md-3 mb-3">
        <div class="card text-white bg-${bg}">
          <div class="card-body d-flex justify-content-between align-items-center">
            <div>
              <div class="text-white-50 small">${title}</div>
              <h4>${value.toLocaleString()}</h4>
            </div>
            <i class="fa ${icon} fa-2x"></i>
          </div>
          <div class="card-footer d-flex justify-content-between align-items-center">
            <a class="text-white small stretched-link" href="${link}">View ${title}</a>
            <i class="fas fa-angle-right"></i>
          </div>
        </div>
      </div>`;

    document.getElementById("dashboardCards").innerHTML = `
      ${cardTemplate("primary", "Payments Today", paymentsToday, "#payments", "fa-calendar")}
      ${cardTemplate("success", "Borrowers", borrowerCount, "#borrowers", "fa-user-friends")}
      ${cardTemplate("warning", "Active Loans", activeLoans, "#loans", "fa-clipboard")}
      ${cardTemplate("info", "Total Receivable", totalReceivable, "#receivables", "fa-coins")}
    `;
  });
</script>
</body>
</html>
